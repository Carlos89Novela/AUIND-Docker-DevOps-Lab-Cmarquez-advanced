<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docker + Traefik</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      height: 100vh;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      padding: 40px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
      max-width: 700px;
    }

    h1 {
      margin: 0 0 15px 0;
      font-size: 2.2rem;
    }

    p {
      font-size: 1.15rem;
      margin: 8px 0;
    }

    .highlight {
      font-weight: bold;
      color: #bfdbfe;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Hola Carlos Márquez</h1>
    <p>Estás dentro de <span class="highlight">Docker Compose</span>.</p>
    <p>Tu entorno local está funcionando correctamente con <span class="highlight">Traefik</span>.</p>
    <p>Arquitectura local con <span class="highlight">HTTPS</span>, subdominios y múltiples servicios ✅</p>
  </div>
</body>
</html>
